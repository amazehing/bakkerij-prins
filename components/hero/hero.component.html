
<section class="hero">
  <img
    src="logo.jpeg"
    alt="Bakkerij Prins"
    class="hero__logo"
    width="200"
    height="200"
  />

  <h1 class="hero__title">
    Vers uit de oven, <span>elke dag</span>
  </h1>

  <p class="hero__description">
    Broodjes, wraps, Turkse pizza's, kapsalon en meer.
  </p>

  <button
    class="hero__button"
    type="button"
    (click)="menuClick.emit()"
  >
    ☰ Bekijk het menu
  </button>
</section>
